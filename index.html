<style>
  :root{
    --green:#0B5D3B; --green-2:#127a4f; --green-soft:#e7f2ec;
    --bg:#f4f6f5; --card:#ffffff; --text:#1d2a24; --muted:#6b7a72;
    --line:#e2e8e4; --red:#c0392b; --gold:#c9a227;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1512; --card:#18211c; --text:#e8efeb; --muted:#93a39a; --line:#26322b; --green-soft:#16271f; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"29LT Bukra","Dubai","Tajawal",system-ui,sans-serif;}
  body{min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom))}

  header{background:var(--green);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 14px;
    position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .top{display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:22px;font-weight:700}
  .date{font-size:13px;opacity:.85;margin-top:2px}
  .menu-btn{background:rgba(255,255,255,.15);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:20px}

  .tabs{display:flex;gap:6px;margin-top:14px;background:rgba(255,255,255,.12);padding:4px;border-radius:14px}
  .tab{flex:1;border:0;background:transparent;color:#fff;padding:9px 2px;border-radius:10px;
    font:inherit;font-size:13px;font-weight:500;display:flex;gap:4px;justify-content:center;align-items:center;white-space:nowrap}
  .tab.active{background:#fff;color:var(--green);font-weight:700}
  .badge{background:rgba(0,0,0,.18);border-radius:20px;padding:0 7px;font-size:12px;min-width:20px}
  .tab.active .badge{background:var(--green);color:#fff}

  main{padding:14px 16px;max-width:640px;margin:0 auto}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;
    display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;animation:in .2s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .item.star{border-right:4px solid var(--gold)}
  .check{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--green);background:transparent;
    margin-top:1px;display:grid;place-items:center;color:#fff;font-size:15px}
  .item.done .check{background:var(--green)}
  .body{flex:1;min-width:0}
  .text{font-size:16px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
  .item.done .text{text-decoration:line-through;color:var(--muted)}
  .who{display:inline-block;background:var(--green-soft);color:var(--green-2);font-size:12px;font-weight:700;
    padding:2px 8px;border-radius:8px;margin-bottom:4px}
  .meta{font-size:12px;color:var(--muted);margin-top:4px}
  .acts{display:flex;flex-direction:column;gap:4px}
  .icon{border:0;background:transparent;color:var(--muted);font-size:17px;width:32px;height:30px;border-radius:8px}
  .icon.on{color:var(--gold)}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px}
  .empty b{display:block;font-size:40px;margin-bottom:8px}
  .clear{display:block;margin:6px auto 0;border:1px solid var(--line);background:var(--card);color:var(--red);
    font:inherit;font-size:13px;padding:8px 16px;border-radius:10px}
  .group{font-size:13px;color:var(--muted);margin:16px 4px 8px;font-weight:700}

  .composer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
  .composer .wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px}
  .composer input{flex:1;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);outline:none;min-width:0}
  .composer input:focus{border-color:var(--green)}
  .add{background:var(--green);color:#fff;border:0;border-radius:12px;width:50px;font-size:26px}
  #who{display:none}
  .composer.msg #who{display:block}
  .composer.hide{display:none}

  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10;align-items:flex-end}
  .sheet.open{display:flex}
  .sheet .panel{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 12px;font-size:17px}
  .sheet button{display:block;width:100%;text-align:right;font:inherit;font-size:15px;padding:14px;margin-bottom:8px;
    border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}
  .sheet .danger{color:var(--red)}
  /* ===== الملاحظات ===== */
  .note{background:var(--green);color:#fff;border-radius:14px;padding:14px;margin-bottom:10px;
    display:flex;gap:12px;align-items:center;animation:in .2s ease;cursor:pointer}
  .note .nbody{flex:1;min-width:0}
  .note .ntitle{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note .nprev{font-size:13px;opacity:.85;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note .ndate{font-size:11px;opacity:.7;margin-top:5px}
  .note .check{border-color:#fff;flex:0 0 26px}
  .note.marked{background:#9aa29e;color:#f3f3f3}
  .note.marked .check{background:#fff;color:#7d8581}
  .note .arrow{opacity:.7;font-size:18px}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
    background:var(--green);color:#fff;border:0;border-radius:30px;padding:14px 26px;font:inherit;font-size:16px;
    font-weight:700;box-shadow:0 6px 18px rgba(11,93,59,.4);z-index:6;display:none}
  .fab.show{display:block}

  .editor{position:fixed;inset:0;background:var(--bg);z-index:15;display:none;flex-direction:column}
  .editor.open{display:flex}
  .ebar{background:var(--green);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;
    display:flex;gap:8px;align-items:center}
  .ebar button{background:rgba(255,255,255,.15);border:0;color:#fff;height:38px;padding:0 14px;border-radius:12px;font:inherit;font-size:14px}
  .ebar .sp{flex:1}
  .ebar .saved{font-size:12px;opacity:.8}
  .editor input,.editor textarea{font:inherit;color:var(--text);background:transparent;border:0;outline:none;padding:0 16px;width:100%}
  .editor input{font-size:20px;font-weight:700;padding-top:18px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .editor textarea{flex:1;font-size:16px;line-height:1.8;padding-top:12px;padding-bottom:30px;resize:none}
  .editor .einfo{font-size:12px;color:var(--muted);padding:8px 16px 0}

  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;
    border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:20;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="top">
    <div>
      <h1>مذكرتي</h1>
      <div class="date" id="today"></div>
    </div>
    <button class="menu-btn" onclick="openSheet()">⋯</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="task">مهامي <span class="badge" id="c-task">0</span></button>
    <button class="tab" data-tab="msg">رسائل للرد <span class="badge" id="c-msg">0</span></button>
    <button class="tab" data-tab="note">ملاحظات <span class="badge" id="c-note">0</span></button>
    <button class="tab" data-tab="done">المنجز <span class="badge" id="c-done">0</span></button>
  </div>
</header>

<main id="list"></main>

<div class="composer" id="composer">
  <div class="wrap">
    <input id="who" placeholder="من؟ (اسم الشخص أو الجهة)" autocomplete="off">
    <div class="row">
      <input id="text" placeholder="أضف مهمة جديدة…" autocomplete="off" enterkeyhint="done">
      <button class="add" onclick="addItem()">+</button>
    </div>
  </div>
</div>

<button class="fab" id="fab" onclick="newNote()">+ ملاحظة جديدة</button>

<div class="editor" id="editor">
  <div class="ebar">
    <button onclick="closeNote()">→ رجوع</button>
    <span class="saved" id="savedLbl"></span>
    <span class="sp"></span>
    <button id="markBtn" onclick="markCurrent()">✓ تعليم</button>
    <button onclick="deleteCurrent()">🗑️</button>
  </div>
  <input id="nTitle" placeholder="العنوان (مثلاً: محضر اجتماع الأحد)" autocomplete="off">
  <div class="einfo" id="nInfo"></div>
  <textarea id="nBody" placeholder="اكتب التفاصيل هنا…"></textarea>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="panel">
    <h3>الإعدادات</h3>
    <button onclick="exportData()">⬇️ حفظ نسخة احتياطية</button>
    <button onclick="document.getElementById('file').click()">⬆️ استرجاع نسخة احتياطية</button>
    <button class="danger" onclick="wipeAll()">🗑️ مسح كل البيانات</button>
    <button onclick="closeSheet()">إغلاق</button>
    <input type="file" id="file" accept=".json" hidden onchange="importData(this)">
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'mudhakirati_v1';
let items = [];
let tab = 'task';

function load(){ try{ items = JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ items = []; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} }

const fmtTime = ts => new Date(ts).toLocaleString('ar-AE',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const dayKey = ts => new Date(ts).toLocaleDateString('ar-AE',{weekday:'long',day:'numeric',month:'long'});
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('today').textContent =
  new Date().toLocaleDateString('ar-AE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function addItem(){
  const t = document.getElementById('text'), w = document.getElementById('who');
  const text = t.value.trim();
  if(!text) return t.focus();
  items.unshift({ id: Date.now()+''+Math.random().toString(36).slice(2,6), type: tab, text,
    who: tab==='msg' ? w.value.trim() : '', created: Date.now(), done:false, star:false });
  t.value = ''; w.value = '';
  save(); render(); t.focus();
}

function toggle(id){
  const it = items.find(i=>i.id===id); if(!it) return;
  it.done = !it.done; it.doneAt = it.done ? Date.now() : null;
  save(); render();
  toast(it.done ? 'أحسنت ✅ انتقلت للمنجز' : 'رجعت للقائمة');
}
function star(id){ const it = items.find(i=>i.id===id); it.star=!it.star; save(); render(); }
function del(id){
  if(!confirm('حذف هذا العنصر؟')) return;
  items = items.filter(i=>i.id!==id); save(); render();
}
function clearDone(){
  if(!confirm('مسح كل المنجز؟')) return;
  items = items.filter(i=>!i.done); save(); render();
}

function card(it){
  return `<div class="item ${it.done?'done':''} ${it.star&&!it.done?'star':''}">
    <button class="check" onclick="toggle('${it.id}')">${it.done?'✓':''}</button>
    <div class="body">
      ${it.who?`<span class="who">${esc(it.who)}</span>`:''}
      ${it.done&&it.type==='msg'&&!it.who?`<span class="who">رسالة</span>`:''}
      <div class="text">${esc(it.text)}</div>
      <div class="meta">${it.done ? 'تم: '+fmtTime(it.doneAt) : 'أضيفت: '+fmtTime(it.created)}</div>
    </div>
    <div class="acts">
      ${!it.done?`<button class="icon ${it.star?'on':''}" onclick="star('${it.id}')">★</button>`:''}
      <button class="icon" onclick="del('${it.id}')">✕</button>
    </div>
  </div>`;
}

function render(){
  const list = document.getElementById('list');
  const open = t => items.filter(i=>i.type===t && !i.done);
  document.getElementById('c-task').textContent = open('task').length;
  document.getElementById('c-msg').textContent = open('msg').length;
  document.getElementById('c-done').textContent = items.filter(i=>i.done && i.type!=='note').length;
  document.getElementById('c-note').textContent = items.filter(i=>i.type==='note' && !i.done).length;

  const comp = document.getElementById('composer');
  comp.className = 'composer' + (tab==='msg'?' msg':'') + (tab==='done'||tab==='note'?' hide':'');
  document.getElementById('fab').classList.toggle('show', tab==='note');

  if(tab==='note'){
    const notes = items.filter(i=>i.type==='note')
      .sort((a,b)=> (a.done-b.done) || ((b.updated||b.created)-(a.updated||a.created)));
    list.innerHTML = notes.length ? notes.map(noteCard).join('')
      : `<div class="empty"><b>🗒️</b>ما فيه ملاحظات، اضغط "ملاحظة جديدة"<br>لمحاضر الاجتماعات والتعليمات</div>`;
    return;
  }
  document.getElementById('text').placeholder = tab==='msg' ? 'وش الرسالة أو الموضوع؟' : 'أضف مهمة جديدة…';

  if(tab==='done'){
    const done = items.filter(i=>i.done && i.type!=='note').sort((a,b)=>b.doneAt-a.doneAt);
    if(!done.length){ list.innerHTML = `<div class="empty"><b>🎯</b>ما فيه مهام منجزة لين الحين</div>`; return; }
    let html='', last='';
    done.forEach(it=>{ const d=dayKey(it.doneAt); if(d!==last){ html+=`<div class="group">${d}</div>`; last=d; } html+=card(it); });
    list.innerHTML = html + `<button class="clear" onclick="clearDone()">مسح المنجز</button>`;
    return;
  }
  const arr = open(tab).sort((a,b)=> (b.star-a.star) || (b.created-a.created));
  list.innerHTML = arr.length ? arr.map(card).join('')
    : `<div class="empty"><b>${tab==='msg'?'💬':'📝'}</b>${tab==='msg'?'ما عليك رسائل معلّقة':'ما عندك مهام، أضف أول مهمة تحت'}</div>`;
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); tab=b.dataset.tab; render();
});
document.getElementById('text').addEventListener('keydown', e=>{ if(e.key==='Enter') addItem(); });
document.getElementById('who').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('text').focus(); });

/* ===== الملاحظات ===== */
let cur = null, saveTimer = null;

function noteCard(n){
  const prev = (n.body||'').split('\n').find(l=>l.trim()) || 'بدون تفاصيل';
  return `<div class="note ${n.done?'marked':''}" onclick="openNote('${n.id}')">
    <button class="check" onclick="event.stopPropagation();toggleNote('${n.id}')">${n.done?'✓':''}</button>
    <div class="nbody">
      <div class="ntitle">${esc(n.text||'بدون عنوان')}</div>
      <div class="nprev">${esc(prev)}</div>
      <div class="ndate">${fmtTime(n.updated||n.created)}</div>
    </div>
    <span class="arrow">‹</span>
  </div>`;
}
function toggleNote(id){
  const n = items.find(i=>i.id===id); n.done=!n.done; save(); render();
  toast(n.done ? 'تم التعليم' : 'رجعت خضراء');
}
function newNote(){
  const n = { id: Date.now()+''+Math.random().toString(36).slice(2,6), type:'note', text:'', body:'',
    created: Date.now(), updated: Date.now(), done:false };
  items.unshift(n); save(); openNote(n.id, true);
}
function openNote(id, fresh){
  cur = items.find(i=>i.id===id); if(!cur) return;
  document.getElementById('nTitle').value = cur.text;
  document.getElementById('nBody').value = cur.body||'';
  document.getElementById('nInfo').textContent = 'أنشئت: '+fmtTime(cur.created);
  document.getElementById('savedLbl').textContent = '';
  updMarkBtn();
  document.getElementById('editor').classList.add('open');
  if(fresh) setTimeout(()=>document.getElementById('nTitle').focus(),50);
}
function updMarkBtn(){ document.getElementById('markBtn').textContent = cur.done ? '↺ إلغاء التعليم' : '✓ تعليم'; }
function saveNote(){
  if(!cur) return;
  cur.text = document.getElementById('nTitle').value.trim();
  cur.body = document.getElementById('nBody').value;
  cur.updated = Date.now(); save();
  document.getElementById('savedLbl').textContent = 'محفوظ ✓';
}
['nTitle','nBody'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{
  document.getElementById('savedLbl').textContent='…';
  clearTimeout(saveTimer); saveTimer=setTimeout(saveNote,400);
}));
function closeNote(){
  clearTimeout(saveTimer); saveNote();
  if(cur && !cur.text && !(cur.body||'').trim()) items = items.filter(i=>i.id!==cur.id);
  save(); cur=null;
  document.getElementById('editor').classList.remove('open'); render();
}
function markCurrent(){ saveNote(); cur.done=!cur.done; save(); updMarkBtn(); toast(cur.done?'تم التعليم':'رجعت خضراء'); }
function deleteCurrent(){
  if(!confirm('حذف هذه الملاحظة؟')) return;
  items = items.filter(i=>i.id!==cur.id); save(); cur=null;
  document.getElementById('editor').classList.remove('open'); render();
}

function openSheet(){ document.getElementById('sheet').classList.add('open'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600); }

function exportData(){
  const blob = new Blob([JSON.stringify(items,null,1)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'mudhakirati-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  closeSheet();
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(Array.isArray(d)){ items=d; save(); render(); toast('تم الاسترجاع'); } }catch(e){ alert('الملف غير صالح'); } };
  r.readAsText(f); input.value=''; closeSheet();
}
function wipeAll(){
  if(!confirm('متأكد؟ بينمسح كل شي')) return;
  items=[]; save(); render(); closeSheet();
}

load(); render();
</script>
</body>
</html>
