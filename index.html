<style>
  :root{
    --green:#0B5D3B; --green-d:#073F28; --green-2:#127a4f; --soft:#E8F2EC; --gold:#B5964D; --gold-soft:#F6F0E1;
    --bg:#F3F6F4; --card:#FFFFFF; --text:#1D2A24; --muted:#6B7A72; --line:#DFE7E2;
    --red:#FF1744; --yellow:#FFD600; --lime:#00E676;
    --red-t:#C4122F; --yellow-t:#8A7300; --lime-t:#00894A;
    --r-bg:#FFF0F3; --y-bg:#FFFBE0; --g-bg:#E6FCEF; --late-bg:#FFE3E8; --prev-t:#6b5a2c; --field:#FFFFFF;
  }
  [data-theme=dark]{
    --soft:#163024; --gold-soft:#2C2614; --bg:#0D1511; --card:#16211B; --text:#E6EEE9; --muted:#93A39A; --line:#26332B;
    --red-t:#FF6B85; --yellow-t:#FFE14D; --lime-t:#4DFFA0; --green:#127a4f;
    --r-bg:#3A1620; --y-bg:#332C0A; --g-bg:#0F3322; --late-bg:#3A1620; --prev-t:#E9D6A3; --field:#1C2A22;
  }
  [data-theme=dark] header{background:linear-gradient(160deg,#0B5D3B 0%,#05301E 100%)}
  [data-theme=dark] nav{background:#08241A}
  [data-theme=dark] .note{background:#0B5D3B} [data-theme=dark] .note.marked{background:#3A433F;color:#B9C2BD}
  [data-theme=dark] .toast{background:#E6EEE9;color:#0D1511}
  [data-theme=dark] .item.done .check,[data-theme=dark] .check{border-color:#2FAE74}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"29LT Bukra","Dubai","Tajawal",system-ui,sans-serif}
  body{min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  button{font-family:inherit}

  header{background:linear-gradient(160deg,var(--green) 0%,var(--green-d) 100%);color:#fff;
    padding:calc(18px + env(safe-area-inset-top)) 18px 16px;border-bottom:3px solid var(--gold)}
  .hrow{display:flex;justify-content:space-between;align-items:flex-end;max-width:640px;margin:0 auto}
  .hello{font-size:12.5px;opacity:.8}
  h1{margin:3px 0 0;font-size:22px;font-weight:800}
  .date{font-size:12px;opacity:.75;margin-top:2px}
  .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 12px;font-size:12.5px;text-align:center}
  .pill b{display:block;font-size:18px;color:#fff}
  .pill.alert b{color:#FF8A9B}

  main{padding:14px 14px;max-width:640px;margin:0 auto}
  .sec{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--muted);margin:16px 4px 8px}
  .sec .n{background:var(--line);color:var(--text);border-radius:10px;padding:1px 8px;font-size:12px}
  .sec.late{color:var(--red-t)} .sec.late .n{background:var(--late-bg);color:var(--red-t)}
  .sec.today{color:var(--green)} .sec.today .n{background:var(--soft);color:var(--green)}

  /* بطاقة المهمة */
  .item{position:relative;background:var(--card);border-radius:16px;padding:12px 14px 12px 10px;margin-bottom:9px;
    display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);overflow:hidden;animation:in .2s ease}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
  .item::before{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:var(--pc)}
  .item.p-red{--pc:var(--red);box-shadow:0 0 0 1px rgba(255,23,68,.25),0 4px 16px rgba(255,23,68,.18)}
  .item.p-yellow{--pc:var(--yellow);box-shadow:0 0 0 1px rgba(255,214,0,.35),0 4px 16px rgba(255,214,0,.22)}
  .item.p-green{--pc:var(--lime);box-shadow:0 0 0 1px rgba(0,230,118,.25),0 4px 16px rgba(0,230,118,.16)}
  .check{flex:0 0 26px;height:26px;margin-right:6px;border-radius:50%;border:2px solid var(--green);background:var(--field);display:grid;place-items:center;
    color:#fff;font-size:14px;font-weight:800;margin-top:1px}
  .item.done .check{background:var(--green)}
  .ib{flex:1;min-width:0}
  .who{display:inline-block;background:var(--soft);color:var(--green);font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:7px;margin-bottom:4px}
  .txt{font-size:15.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .item.done .txt{text-decoration:line-through;color:var(--muted)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:11.5px;color:var(--muted);align-items:center}
  .chip{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 8px;background:var(--bg);font-weight:700}
  .chip.late{background:var(--late-bg);color:var(--red-t)}
  .chip.soon{background:var(--soft);color:var(--green)}
  .acts{display:flex;flex-direction:column;gap:2px}
  .ic{border:0;background:transparent;color:#9AA7A0;font-size:16px;width:32px;height:30px;border-radius:9px}
  .ic:active{background:var(--bg)}

  /* الملاحظات */
  .note{background:var(--green);color:#fff;border-radius:16px;padding:14px;margin-bottom:9px;display:flex;gap:12px;align-items:center;cursor:pointer;animation:in .2s ease}
  .note .check{border-color:#fff;background:transparent;margin:0}
  .note .nb{flex:1;min-width:0}
  .note .nt{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note .np{font-size:13px;opacity:.85;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note .nd{font-size:11px;opacity:.7;margin-top:4px}
  .note.marked{background:#A3ACA8}
  .note.marked .check{background:#fff;color:#7d8581}

  .empty{text-align:center;color:var(--muted);padding:46px 20px;font-size:14.5px;line-height:1.8}
  .empty b{display:block;font-size:40px;margin-bottom:6px}
  .clear{display:block;margin:12px auto 0;border:1px solid var(--line);background:var(--card);color:var(--red-t);font-size:13px;padding:9px 18px;border-radius:12px}

  /* الملخص */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .card h3{margin:0 0 12px;font-size:15px;color:var(--green)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .st{border-radius:14px;padding:12px 6px;text-align:center;background:var(--bg)}
  .st b{display:block;font-size:24px;font-weight:800}
  .st span{font-size:12px;color:var(--muted)}
  .st.r{background:var(--r-bg)} .st.r b{color:var(--red-t)}
  .st.y{background:var(--y-bg)} .st.y b{color:var(--yellow-t)}
  .st.g{background:var(--g-bg)} .st.g b{color:var(--lime-t)}
  .st.gr b{color:var(--green)}
  .card p{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.7}
  .card input{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none}
  .sbtn{display:block;width:100%;text-align:right;font-size:15px;padding:13px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}

  /* شريط الإضافة */
  .composer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:8px 12px;z-index:6}
  .cw{max-width:640px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;
    box-shadow:0 8px 26px rgba(7,63,40,.14);display:flex;gap:6px;align-items:center}
  .cw input{flex:1;min-width:0;font:inherit;font-size:16px;border:0;outline:none;padding:10px 8px;background:transparent;color:var(--text)}
  .dots{display:flex;gap:5px;padding:0 2px}
  .dot{width:20px;height:20px;border-radius:50%;border:0;opacity:.35;transition:.15s}
  .dot.on{opacity:1;transform:scale(1.15)}
  .dot.red{background:var(--red);box-shadow:0 0 8px var(--red)} .dot.yellow{background:var(--yellow);box-shadow:0 0 8px var(--yellow)} .dot.green{background:var(--lime);box-shadow:0 0 8px var(--lime)}
  .bell{border:0;background:var(--gold-soft);color:var(--gold);width:42px;height:42px;border-radius:13px;font-size:19px}
  .plus{border:0;background:var(--green);color:#fff;width:46px;height:42px;border-radius:13px;font-size:24px;font-weight:700}
  .fab{display:none;margin:0 auto;border:0;background:var(--green);color:#fff;font-size:16px;font-weight:800;padding:14px 28px;border-radius:18px;box-shadow:0 8px 22px rgba(11,93,59,.35)}
  .composer.nmode .cw{display:none} .composer.nmode .fab{display:block}
  .composer.hide{display:none}

  /* الشريط السفلي */
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--green-d);z-index:7;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:2px solid var(--gold)}
  nav .in{max-width:640px;margin:0 auto;display:flex}
  nav button{flex:1;border:0;background:transparent;color:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:3px 0;position:relative}
  nav .ni{font-size:18px;width:44px;height:28px;border-radius:10px;display:grid;place-items:center}
  nav button.on{color:#fff;font-weight:800}
  nav button.on .ni{background:rgba(255,255,255,.14)}
  nav .bd{position:absolute;top:-2px;left:calc(50% - 24px);background:var(--gold);color:#fff;border-radius:9px;min-width:17px;height:17px;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
  nav .bd.late{background:var(--red)}

  /* نافذة التفاصيل */
  .sheet{position:fixed;inset:0;background:rgba(7,30,20,.45);display:none;z-index:20;align-items:flex-end}
  .sheet.open{display:flex}
  .panel{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:93vh;overflow:auto}
  .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
  .panel h3{margin:0 0 12px;font-size:17px;color:var(--green)}
  .lbl{font-size:12.5px;color:var(--muted);font-weight:700;margin:14px 2px 7px}
  .panel textarea,.panel input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none;resize:none}
  .prio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .prio button{border:2px solid var(--line);background:var(--field);border-radius:13px;padding:10px 4px;font-size:13.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--text)}
  .prio button i{width:16px;height:16px;border-radius:50%}
  .prio .red i{background:var(--red);box-shadow:0 0 8px var(--red)} .prio .yellow i{background:var(--yellow);box-shadow:0 0 8px var(--yellow)} .prio .green i{background:var(--lime);box-shadow:0 0 8px var(--lime)}
  .prio .red.on{border-color:var(--red);background:var(--r-bg);color:var(--red-t)}
  .prio .yellow.on{border-color:var(--yellow);background:var(--y-bg);color:var(--yellow-t)}
  .prio .green.on{border-color:var(--lime);background:var(--g-bg);color:var(--lime-t)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chips button{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 13px;font-size:14px;color:var(--text)}
  .chips button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:800}
  .row2{display:flex;gap:8px}
  .row2 input{flex:1;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-width:0}
  .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
  .seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-size:14px;color:var(--text)}
  .seg button.on{background:var(--gold);color:#fff;font-weight:800}
  .rem{display:flex;align-items:center;gap:8px;margin-top:8px}
  .rem span{font-size:13px;color:var(--muted);width:56px;white-space:nowrap}
  .rem select{flex:1;font:inherit;font-size:15px;padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--field);color:var(--text)}
  .prev{margin-top:12px;padding:11px 12px;background:var(--gold-soft);border-radius:12px;font-size:13.5px;line-height:1.7;color:var(--prev-t)}
  .remwrap.off{display:none}
  .btns{display:flex;gap:8px;margin-top:16px}
  .btns button{flex:1;border:0;border-radius:13px;padding:14px 6px;font-size:15px;font-weight:800}
  .b1{background:var(--green);color:#fff} .b2{background:var(--gold);color:#fff} .b3{background:var(--bg);color:var(--text);border:1px solid var(--line)!important}
  .bdel{background:var(--r-bg);color:var(--red-t)}

  /* محرر الملاحظة */
  .editor{position:fixed;inset:0;background:var(--bg);z-index:25;display:none;flex-direction:column}
  .editor.open{display:flex}
  .ebar{background:var(--green);padding:calc(12px + env(safe-area-inset-top)) 12px 12px;display:flex;gap:8px;align-items:center;border-bottom:3px solid var(--gold)}
  .ebar button{border:0;background:rgba(255,255,255,.16);color:#fff;height:38px;padding:0 14px;border-radius:12px;font-size:14px}
  .ebar .sp{flex:1} .ebar .sv{font-size:12px;color:#fff;opacity:.8}
  .editor input,.editor textarea{font:inherit;color:var(--text);background:transparent;border:0;outline:none;padding:0 16px;width:100%}
  .editor input{font-size:20px;font-weight:800;padding-top:16px;padding-bottom:6px}
  .editor .ei{font-size:12px;color:var(--muted);padding:0 16px 10px;border-bottom:1px solid var(--line)}
  .editor textarea{flex:1;font-size:16px;line-height:1.85;padding-top:12px;resize:none}

  /* تنبيه داخلي */
  .alarm{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;max-width:600px;margin:0 auto;z-index:40;
    background:var(--green-d);color:#fff;border-radius:16px;padding:14px;display:none;gap:12px;align-items:center;
    box-shadow:0 10px 30px rgba(0,0,0,.3);border-right:6px solid var(--pc,var(--gold))}
  .alarm.show{display:flex;animation:in .25s ease}
  .alarm .ab{flex:1} .alarm .at{font-size:12px;opacity:.75} .alarm .ax{font-size:16px;font-weight:800;margin-top:2px}
  .alarm button{border:0;background:var(--gold);color:#fff;border-radius:11px;padding:9px 12px;font-size:13px;font-weight:800}
  .toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#1D2A24;color:#fff;
    padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:50;pointer-events:none;display:flex;gap:10px;align-items:center;white-space:nowrap}
  .toast.show{opacity:1;pointer-events:auto}
  .toast button{border:0;background:var(--gold);color:#fff;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:800}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <div class="hello" id="hello"></div>
      <h1 id="title">مهامي</h1>
      <div class="date" id="today"></div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="pill" id="thBtn" onclick="toggleTheme()" style="color:#fff;font-size:18px;min-width:44px"></button>
      <div class="pill" id="pToday"><b>0</b>اليوم</div>
      <div class="pill alert" id="pLate"><b>0</b>متأخر</div>
    </div>
  </div>
</header>

<main id="list"></main>

<div class="composer" id="composer">
  <div class="cw">
    <input id="qText" placeholder="مهمة جديدة…" autocomplete="off" enterkeyhint="done">
    <div class="dots" id="qDots">
      <button class="dot red" data-p="red"></button>
      <button class="dot yellow" data-p="yellow"></button>
      <button class="dot green on" data-p="green"></button>
    </div>
    <button class="bell" onclick="openSheet()" title="تذكير">⏰</button>
    <button class="plus" onclick="quickAdd()">+</button>
  </div>
  <button class="fab" onclick="newNote()">+ ملاحظة جديدة</button>
</div>

<nav><div class="in" id="nav"></div></nav>

<!-- إضافة / تعديل -->
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="panel">
    <div class="grab"></div>
    <h3 id="shTitle">مهمة جديدة</h3>
    <div id="whoWrap"><div class="lbl">من؟</div><input type="text" id="fWho" placeholder="اسم الشخص أو الجهة" autocomplete="off"></div>
    <div class="lbl">وش المهمة؟</div>
    <textarea id="fText" rows="2" placeholder="اكتب هنا…"></textarea>

    <div class="lbl">الأهمية</div>
    <div class="prio" id="fPrio">
      <button class="red" data-p="red"><i></i>مهم جداً</button>
      <button class="yellow" data-p="yellow"><i></i>مهم</button>
      <button class="green" data-p="green"><i></i>عادي</button>
    </div>

    <div class="lbl">متى؟</div>
    <div class="chips" id="fDay">
      <button data-d="none">بدون موعد</button>
      <button data-d="0">اليوم</button>
      <button data-d="1">بكرة</button>
      <button data-d="2">بعد بكرة</button>
      <button data-d="pick">📅 تاريخ</button>
    </div>
    <div class="remwrap" id="whenWrap">
      <div class="row2" style="margin-top:10px">
        <input type="date" id="fDate">
        <input type="time" id="fTime">
      </div>
      <div class="chips" id="fQuickTime" style="margin-top:8px">
        <button data-t="08:00">8 ص</button><button data-t="12:00">12 ظ</button><button data-t="16:00">4 م</button><button data-t="20:00">8 م</button><button data-t="22:00">10 م</button>
      </div>

      <div class="lbl">كم مرة يذكرني؟</div>
      <div class="seg" id="fCount">
        <button data-n="0">بدون</button>
        <button data-n="1">مرة</button>
        <button data-n="2">مرتين</button>
        <button data-n="3">٣ مرات</button>
      </div>
      <div id="fRems"></div>
      <div class="prev" id="fPrev"></div>
    </div>

    <div class="btns">
      <button class="b1" onclick="saveSheet(false)">حفظ</button>
      <button class="b2" id="btnCal" onclick="saveSheet(true)">حفظ + 📅 التقويم</button>
    </div>
    <div class="btns" id="delWrap" style="display:none"><button class="bdel" onclick="delFromSheet()">حذف</button><button class="b3" onclick="closeSheet()">إلغاء</button></div>
  </div>
</div>

<!-- محرر الملاحظة -->
<div class="editor" id="editor">
  <div class="ebar">
    <button onclick="closeNote()">→ رجوع</button>
    <span class="sv" id="sv"></span><span class="sp"></span>
    <button id="markBtn" onclick="markCurrent()">✓ تعليم</button>
    <button onclick="deleteCurrent()">🗑️</button>
  </div>
  <input id="nTitle" placeholder="العنوان (مثلاً: محضر اجتماع الأحد)" autocomplete="off">
  <div class="ei" id="nInfo"></div>
  <textarea id="nBody" placeholder="اكتب التفاصيل هنا…"></textarea>
</div>

<div class="alarm" id="alarm">
  <div class="ab"><div class="at" id="alT">⏰ تذكير</div><div class="ax" id="alX"></div></div>
  <button onclick="alarmDone()">✓ خلصت</button>
  <button onclick="hideAlarm()" style="background:rgba(255,255,255,.15)">لاحقاً</button>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".json" hidden onchange="importData(this)">

<script>
const KEY='mudhakirati_v1';           // نفس مفتاح النسخة القديمة عشان ما تضيع بياناتك
const TABS=[
  {id:'task',  name:'مهامي',        ic:'📋'},
  {id:'msg',   name:'رسائل للرد',   ic:'💬'},
  {id:'note',  name:'ملاحظات',      ic:'📝'},
  {id:'done',  name:'المنجز',       ic:'✅'},
  {id:'sum',   name:'الملخص',       ic:'📊'},
];
const PR={red:{n:'مهم جداً',o:0},yellow:{n:'مهم',o:1},green:{n:'عادي',o:2}};
const OFFS=[[0,'وقت الموعد'],[5,'قبل 5 دقايق'],[10,'قبل 10 دقايق'],[15,'قبل ربع ساعة'],[30,'قبل نص ساعة'],
  [60,'قبل ساعة'],[120,'قبل ساعتين'],[180,'قبل 3 ساعات'],[240,'قبل 4 ساعات'],[300,'قبل 5 ساعات'],[360,'قبل 6 ساعات'],[720,'قبل 12 ساعة'],
  [1440,'قبل يوم'],[2880,'قبل يومين'],[4320,'قبل 3 أيام'],[10080,'قبل أسبوع'],[20160,'قبل أسبوعين'],[43200,'قبل شهر']];
const DEF={1:[0],2:[30,0],3:[60,15,0]};

let items=[], name='', tab='task', qPrio='green', cur=null, saveTimer=null;
let sh={};   // حالة نافذة الإضافة

/* ---------- تخزين ---------- */
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(d)) items=d; else if(d&&d.items){ items=d.items; name=d.name||''; } }catch(e){}
  try{ name=localStorage.getItem(KEY+'_name')||name; }catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(items)); localStorage.setItem(KEY+'_name',name); }catch(e){} }

/* ---------- أدوات ---------- */
const uid=()=>Date.now()+Math.random().toString(36).slice(2,6);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d);};
const dueDate=i=>i.due?new Date(i.due):null;
const tFmt=d=>d.toLocaleTimeString('ar-AE',{hour:'numeric',minute:'2-digit'});
const dLbl=d=>{ const k=ymd(d); if(k===ymd(new Date()))return 'اليوم'; if(k===addDays(1))return 'بكرة'; if(k===addDays(-1))return 'أمس';
  return d.toLocaleDateString('ar-AE',{weekday:'short',day:'numeric',month:'short'}); };
const fmtFull=ts=>new Date(ts).toLocaleString('ar-AE',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const dayKey=ts=>new Date(ts).toLocaleDateString('ar-AE',{weekday:'long',day:'numeric',month:'long'});
const offTxt=m=>(OFFS.find(o=>o[0]===m)||[0,m+' د'])[1];
const isLate=i=>!i.done&&i.due&&dueDate(i)<new Date();
const isToday=i=>!i.done&&i.due&&ymd(dueDate(i))===ymd(new Date());

/* ---------- العرض ---------- */
function greet(){ const h=new Date().getHours(); return (h>=4&&h<12?'صباح الخير ☀️':'مساء الخير 🌙')+(name?' يا '+name:''); }
let theme='light'; try{ theme=localStorage.getItem(KEY+'_theme')||'light'; }catch(e){}
function applyTheme(){ document.documentElement.dataset.theme=theme; document.getElementById('thBtn').textContent=theme==='dark'?'☀️':'🌙';
  document.querySelector('meta[name=theme-color]').content=theme==='dark'?'#05301E':'#0B5D3B'; }
function toggleTheme(){ setTheme(theme==='dark'?'light':'dark'); }
function setTheme(t){ theme=t; try{ localStorage.setItem(KEY+'_theme',t); }catch(e){} applyTheme(); if(tab==='sum') render(); }

function renderNav(){
  const open=t=>items.filter(i=>i.type===t&&!i.done).length;
  const late=t=>items.filter(i=>i.type===t&&isLate(i)).length;
  document.getElementById('nav').innerHTML=TABS.map(t=>{
    let bd='';
    if(t.id==='task'||t.id==='msg'){ const l=late(t.id),o=open(t.id); if(l) bd=`<span class="bd late">${l}</span>`; else if(o) bd=`<span class="bd">${o}</span>`; }
    return `<button class="${t.id===tab?'on':''}" onclick="go('${t.id}')"><span class="ni">${t.ic}</span>${t.name}${bd}</button>`;
  }).join('');
}
function go(t){ tab=t; render(); scrollTo(0,0); }

function render(){
  renderNav();
  document.getElementById('hello').textContent=greet();
  document.getElementById('title').textContent=TABS.find(t=>t.id===tab).name;
  const act=items.filter(i=>(i.type==='task'||i.type==='msg'));
  document.querySelector('#pToday b').textContent=act.filter(isToday).length;
  document.querySelector('#pLate b').textContent=act.filter(isLate).length;
  const comp=document.getElementById('composer');
  comp.className='composer'+(tab==='note'?' nmode':'')+(tab==='done'||tab==='sum'?' hide':'');
  document.getElementById('qText').placeholder=tab==='msg'?'رسالة لازم ترد عليها…':'مهمة جديدة…';
  const L=document.getElementById('list');

  if(tab==='task'||tab==='msg'){
    const arr=items.filter(i=>i.type===tab&&!i.done);
    if(!arr.length){ L.innerHTML=`<div class="empty"><b>${tab==='msg'?'💬':'📋'}</b>${tab==='msg'?'ما عليك رسائل معلّقة':'ما عندك مهام'}<br>اكتب تحت، واضغط ⏰ إذا تبي تذكير</div>`; return; }
    const sortFn=(a,b)=>(PR[a.prio||'green'].o-PR[b.prio||'green'].o)||((a.due?dueDate(a):Infinity)-(b.due?dueDate(b):Infinity))||(b.created-a.created);
    const byTime=(a,b)=>(dueDate(a)-dueDate(b))||(PR[a.prio||'green'].o-PR[b.prio||'green'].o);
    const groups=[
      ['late','⚠️ متأخر',arr.filter(isLate).sort(byTime)],
      ['today','اليوم',arr.filter(i=>isToday(i)&&!isLate(i)).sort(byTime)],
      ['','بكرة',arr.filter(i=>i.due&&ymd(dueDate(i))===addDays(1)).sort(byTime)],
      ['','قادم',arr.filter(i=>i.due&&ymd(dueDate(i))>addDays(1)).sort(byTime)],
      ['','بدون موعد',arr.filter(i=>!i.due).sort(sortFn)],
    ];
    L.innerHTML=groups.filter(g=>g[2].length).map(g=>`<div class="sec ${g[0]}">${g[1]} <span class="n">${g[2].length}</span></div>`+g[2].map(card).join('')).join('');
    return;
  }
  if(tab==='note'){
    const arr=items.filter(i=>i.type==='note').sort((a,b)=>(a.done-b.done)||((b.updated||b.created)-(a.updated||a.created)));
    L.innerHTML=arr.length?arr.map(noteCard).join(''):`<div class="empty"><b>📝</b>ما فيه ملاحظات<br>محاضر الاجتماعات وتعليمات المدير… كلها هنا</div>`;
    return;
  }
  if(tab==='done'){
    const arr=items.filter(i=>i.done&&i.type!=='note').sort((a,b)=>b.doneAt-a.doneAt);
    if(!arr.length){ L.innerHTML=`<div class="empty"><b>✅</b>اللي تخلصه يوصل هنا</div>`; return; }
    let h='',last=''; arr.forEach(i=>{ const d=dayKey(i.doneAt); if(d!==last){h+=`<div class="sec">${d}</div>`;last=d;} h+=card(i); });
    L.innerHTML=h+`<button class="clear" onclick="clearDone()">مسح المنجز</button>`; return;
  }
  // الملخص
  const open=items.filter(i=>(i.type==='task'||i.type==='msg')&&!i.done);
  const c=p=>open.filter(i=>(i.prio||'green')===p).length;
  const doneT=items.filter(i=>i.done&&i.type!=='note'&&ymd(new Date(i.doneAt))===ymd(new Date())).length;
  const wk=Date.now()-7*864e5, doneW=items.filter(i=>i.done&&i.type!=='note'&&i.doneAt>wk).length;
  const upcoming=open.filter(i=>i.due&&!isLate(i)).sort((a,b)=>dueDate(a)-dueDate(b)).slice(0,4);
  L.innerHTML=`
    <div class="card"><h3>الوضع الحين</h3><div class="grid3">
      <div class="st r"><b>${c('red')}</b><span>مهم جداً</span></div>
      <div class="st y"><b>${c('yellow')}</b><span>مهم</span></div>
      <div class="st g"><b>${c('green')}</b><span>عادي</span></div>
      <div class="st r"><b>${open.filter(isLate).length}</b><span>متأخر</span></div>
      <div class="st gr"><b>${open.filter(isToday).length}</b><span>موعدها اليوم</span></div>
      <div class="st gr"><b>${items.filter(i=>i.type==='msg'&&!i.done).length}</b><span>رسائل للرد</span></div>
    </div></div>
    <div class="card"><h3>الإنجاز</h3><div class="grid3">
      <div class="st gr"><b>${doneT}</b><span>اليوم</span></div>
      <div class="st gr"><b>${doneW}</b><span>آخر 7 أيام</span></div>
      <div class="st"><b>${items.filter(i=>i.type==='note').length}</b><span>ملاحظات</span></div>
    </div></div>
    ${upcoming.length?`<div class="card"><h3>الجاي</h3>${upcoming.map(card).join('')}</div>`:''}
    <div class="card"><h3>الواجهة</h3><div class="seg" style="--x:0"><button class="${theme==='light'?'on':''}" onclick="setTheme('light')">☀️ فاتح</button><button class="${theme==='dark'?'on':''}" onclick="setTheme('dark')">🌙 داكن</button></div></div>
    <div class="card"><h3>اسمك</h3><input value="${esc(name)}" placeholder="للترحيب فوق" onchange="name=this.value.trim();save();render()"></div>
    <div class="card"><h3>النسخ الاحتياطي</h3><p>البيانات محفوظة في هذا الجهاز بس.</p>
      <button class="sbtn" onclick="exportData()">⬇️ حفظ نسخة احتياطية</button>
      <button class="sbtn" onclick="document.getElementById('file').click()">⬆️ استرجاع نسخة</button>
      <button class="sbtn" style="color:var(--red-t)" onclick="wipeAll()">🗑️ مسح كل البيانات</button></div>`;
}

function card(i){
  const p=i.prio||'green', d=dueDate(i);
  let meta='';
  if(i.done) meta=`<span>تم: ${fmtFull(i.doneAt)}</span>`;
  else{
    if(d) meta+=`<span class="chip ${isLate(i)?'late':isToday(i)?'soon':''}">🕒 ${dLbl(d)} ${tFmt(d)}</span>`;
    if(d&&(i.rem||[]).length) meta+=`<span class="chip">🔔 ×${i.rem.length}</span>`;
    if(!d) meta+=`<span>${fmtFull(i.created)}</span>`;
  }
  return `<div class="item p-${p} ${i.done?'done':''}">
    <button class="check" onclick="toggle('${i.id}')">${i.done?'✓':''}</button>
    <div class="ib" onclick="${i.done?'':`openSheet('${i.id}')`}">
      ${i.who?`<span class="who">${esc(i.who)}</span>`:''}
      <div class="txt">${esc(i.text)}</div>
      <div class="meta">${meta}</div>
    </div>
    <div class="acts">
      ${!i.done&&d?`<button class="ic" onclick="addToCal('${i.id}')" title="أضف للتقويم">📅</button>`:''}
      <button class="ic" onclick="del('${i.id}')">✕</button>
    </div></div>`;
}

/* ---------- إضافة سريعة ---------- */
document.querySelectorAll('#qDots .dot').forEach(b=>b.onclick=()=>{ qPrio=b.dataset.p; document.querySelectorAll('#qDots .dot').forEach(x=>x.classList.toggle('on',x===b)); });
function quickAdd(){
  const t=document.getElementById('qText'), v=t.value.trim(); if(!v) return t.focus();
  items.unshift({id:uid(),type:tab,text:v,prio:qPrio,created:Date.now(),done:false});
  t.value=''; save(); render(); t.focus();
}
document.getElementById('qText').addEventListener('keydown',e=>{ if(e.key==='Enter') quickAdd(); });

/* ---------- نافذة التفاصيل ---------- */
function openSheet(id){
  const it=id?items.find(x=>x.id===id):null;
  const now=new Date(); now.setMinutes(0); now.setHours(now.getHours()+1);
  sh={ id:it?it.id:null, type:it?it.type:tab, prio:it?it.prio||'green':qPrio,
       date:it&&it.due?it.due.slice(0,10):'', time:it&&it.due?it.due.slice(11,16):pad(now.getHours())+':00',
       rem:it?(it.rem||[]).slice():[30,0] };
  if(!it&&!sh.date){ sh.date=ymd(new Date()); }   // تذكير جديد: الافتراضي اليوم
  sh.day = !it? '0' : !it.due? 'none' : sh.date===ymd(new Date())?'0':sh.date===addDays(1)?'1':sh.date===addDays(2)?'2':'pick';
  if(it&&!it.due) sh.rem=[30,0];
  document.getElementById('shTitle').textContent=it?'تعديل':(sh.type==='msg'?'رسالة للرد':'مهمة جديدة');
  document.getElementById('whoWrap').style.display=sh.type==='msg'?'block':'none';
  document.getElementById('fWho').value=it?it.who||'':'';
  document.getElementById('fText').value=it?it.text:document.getElementById('qText').value;
  document.getElementById('delWrap').style.display=it?'flex':'none';
  paintSheet();
  document.getElementById('sheet').classList.add('open');
  if(!document.getElementById('fText').value) setTimeout(()=>document.getElementById('fText').focus(),80);
}
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); }
function paintSheet(){
  document.querySelectorAll('#fPrio button').forEach(b=>b.classList.toggle('on',b.dataset.p===sh.prio));
  document.querySelectorAll('#fDay button').forEach(b=>b.classList.toggle('on',b.dataset.d===sh.day));
  const has=sh.day!=='none';
  document.getElementById('whenWrap').classList.toggle('off',!has);
  document.getElementById('btnCal').style.display=has?'block':'none';
  document.getElementById('fDate').value=sh.date; document.getElementById('fTime').value=sh.time;
  document.getElementById('fDate').style.display=sh.day==='pick'?'block':'none';
  document.querySelectorAll('#fQuickTime button').forEach(b=>b.classList.toggle('on',b.dataset.t===sh.time));
  document.querySelectorAll('#fCount button').forEach(b=>b.classList.toggle('on',+b.dataset.n===sh.rem.length));
  document.getElementById('fRems').innerHTML=sh.rem.map((m,k)=>`<div class="rem"><span>تذكير ${k+1}</span>
    <select onchange="sh.rem[${k}]=+this.value;preview()">${OFFS.map(o=>`<option value="${o[0]}" ${o[0]===m?'selected':''}>${o[1]}</option>`).join('')}</select></div>`).join('');
  preview();
}
function preview(){
  const p=document.getElementById('fPrev');
  if(sh.day==='none'||!sh.date||!sh.time){ p.style.display='none'; return; }
  p.style.display='block';
  const due=new Date(sh.date+'T'+sh.time);
  const times=[...sh.rem].sort((a,b)=>b-a).map(m=>{ const t=new Date(due-m*6e4); return `${dLbl(t)} ${tFmt(t)}`; });
  p.innerHTML=`الموعد: <b>${dLbl(due)} ${tFmt(due)}</b><br>`+(times.length?`بيذكرك: <b>${times.join(' ، ')}</b>`:'بدون تذكير');
}
document.querySelectorAll('#fPrio button').forEach(b=>b.onclick=()=>{ sh.prio=b.dataset.p; paintSheet(); });
document.querySelectorAll('#fDay button').forEach(b=>b.onclick=()=>{
  sh.day=b.dataset.d;
  if(sh.day==='none'){} else if(sh.day==='pick'){ if(!sh.date) sh.date=addDays(3); setTimeout(()=>{ const f=document.getElementById('fDate'); f.showPicker?f.showPicker():f.focus(); },50); }
  else sh.date=addDays(+sh.day);
  paintSheet();
});
document.querySelectorAll('#fQuickTime button').forEach(b=>b.onclick=()=>{ sh.time=b.dataset.t; paintSheet(); });
document.getElementById('fDate').onchange=e=>{ sh.date=e.target.value; preview(); };
document.getElementById('fTime').onchange=e=>{ sh.time=e.target.value; paintSheet(); };
document.querySelectorAll('#fCount button').forEach(b=>b.onclick=()=>{
  const n=+b.dataset.n; sh.rem = n===0?[] : (sh.rem.length===n? sh.rem : DEF[n].slice()); paintSheet(); });

function saveSheet(cal){
  const text=document.getElementById('fText').value.trim();
  if(!text){ document.getElementById('fText').focus(); return; }
  const has=sh.day!=='none'&&sh.date&&sh.time;
  const data={ text, prio:sh.prio, who:sh.type==='msg'?document.getElementById('fWho').value.trim():'',
    due: has? sh.date+'T'+sh.time : null, rem: has? [...new Set(sh.rem)].sort((a,b)=>b-a) : [], fired:[] };
  if(has) data.fired=data.rem.filter(m=>+new Date(data.due)-m*6e4<=Date.now());
  let it;
  if(sh.id){ it=items.find(x=>x.id===sh.id); Object.assign(it,data); }
  else{ it=Object.assign({id:uid(),type:sh.type,created:Date.now(),done:false},data); items.unshift(it); }
  document.getElementById('qText').value='';
  save(); closeSheet(); render();
  if(cal&&has) addToCal(it.id); else toast(has?'تم الحفظ ⏰':'تم الحفظ');
}
function delFromSheet(){ if(!confirm('حذف؟')) return; items=items.filter(x=>x.id!==sh.id); save(); closeSheet(); render(); }

/* ---------- التقويم (ics) ---------- */
function icsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function utc(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'; }
function addToCal(id){
  const i=items.find(x=>x.id===id); if(!i||!i.due) return;
  const s=dueDate(i), e=new Date(+s+30*6e4);
  const title=(i.prio==='red'?'🔴 ':i.prio==='yellow'?'🟡 ':'🟢 ')+(i.who?i.who+': ':'')+i.text.split('\n')[0];
  const alarms=(i.rem||[]).map(m=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:'+(!m?'PT0M':m%1440===0?'-P'+(m/1440)+'D':'-PT'+m+'M'),'END:VALARM']).flat();
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mudhakirati//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT','UID:'+i.id+'@mudhakirati','DTSTAMP:'+utc(new Date()),'DTSTART:'+utc(s),'DTEND:'+utc(e),
    'SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc(i.text+'\n— من مذكرتي ('+PR[i.prio||'green'].n+')'),
    ...alarms,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='تذكير.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  toast('افتح الملف واضغط "إضافة" للتقويم 📅');
}

/* ---------- المهام ---------- */
function toggle(id){ const i=items.find(x=>x.id===id); i.done=!i.done; i.doneAt=i.done?Date.now():null; save(); render(); toast(i.done?'أحسنت ✅':'رجعت للقائمة'); }
function del(id){ if(!confirm('حذف؟')) return; items=items.filter(x=>x.id!==id); save(); render(); }
function clearDone(){ if(!confirm('مسح كل المنجز؟')) return; items=items.filter(i=>!(i.done&&i.type!=='note')); save(); render(); }

/* ---------- التنبيه داخل الصفحة ---------- */
let alarmId=null;
function checkAlarms(){
  const now=Date.now();
  for(const i of items){
    if(i.done||!i.due||!(i.rem||[]).length) continue;
    i.fired=i.fired||[];
    for(const m of i.rem){
      const t=+dueDate(i)-m*6e4;
      if(t<=now && now-t<12*36e5 && !i.fired.includes(m)){
        i.fired.push(m); save(); showAlarm(i,m); return;
      }
    }
  }
}
function showAlarm(i,m){
  alarmId=i.id; const a=document.getElementById('alarm');
  a.style.setProperty('--pc',`var(--${i.prio==='red'?'red':i.prio==='yellow'?'yellow':'lime'})`);
  document.getElementById('alT').textContent='⏰ '+(m?offTxt(m).replace('قبل','باقي'):'حان الموعد')+' · '+tFmt(dueDate(i));
  document.getElementById('alX').textContent=(i.who?i.who+': ':'')+i.text;
  a.classList.add('show'); try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){}
  render();
}
function hideAlarm(){ document.getElementById('alarm').classList.remove('show'); alarmId=null; setTimeout(checkAlarms,400); }
function alarmDone(){ const i=items.find(x=>x.id===alarmId); if(i){ i.done=true; i.doneAt=Date.now(); save(); render(); } hideAlarm(); }

/* ---------- الملاحظات ---------- */
function noteCard(n){
  const p=(n.body||'').split('\n').find(l=>l.trim())||'بدون تفاصيل';
  return `<div class="note ${n.done?'marked':''}" onclick="openNote('${n.id}')">
    <button class="check" onclick="event.stopPropagation();toggleNote('${n.id}')">${n.done?'✓':''}</button>
    <div class="nb"><div class="nt">${esc(n.text||'بدون عنوان')}</div><div class="np">${esc(p)}</div><div class="nd">${fmtFull(n.updated||n.created)}</div></div>
    <span style="opacity:.7;font-size:20px">‹</span></div>`;
}
function toggleNote(id){ const n=items.find(x=>x.id===id); n.done=!n.done; save(); render(); }
function newNote(){ const n={id:uid(),type:'note',text:'',body:'',created:Date.now(),updated:Date.now(),done:false}; items.unshift(n); save(); openNote(n.id,true); }
function openNote(id,fresh){ cur=items.find(x=>x.id===id); if(!cur) return;
  nTitle.value=cur.text; nBody.value=cur.body||''; nInfo.textContent='أنشئت: '+fmtFull(cur.created); sv.textContent='';
  markBtn.textContent=cur.done?'↺ إلغاء':'✓ تعليم'; editor.classList.add('open'); if(fresh) setTimeout(()=>nTitle.focus(),60); }
function saveNote(){ if(!cur) return; cur.text=nTitle.value.trim(); cur.body=nBody.value; cur.updated=Date.now(); save(); sv.textContent='محفوظ ✓'; }
['nTitle','nBody'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{ sv.textContent='…'; clearTimeout(saveTimer); saveTimer=setTimeout(saveNote,400); }));
function closeNote(){ clearTimeout(saveTimer); saveNote(); if(cur&&!cur.text&&!(cur.body||'').trim()) items=items.filter(x=>x.id!==cur.id); save(); cur=null; editor.classList.remove('open'); render(); }
function markCurrent(){ saveNote(); cur.done=!cur.done; save(); markBtn.textContent=cur.done?'↺ إلغاء':'✓ تعليم'; }
function deleteCurrent(){ if(!confirm('حذف هذه الملاحظة؟')) return; items=items.filter(x=>x.id!==cur.id); save(); cur=null; editor.classList.remove('open'); render(); }

/* ---------- أخرى ---------- */
function exportData(){ const b=new Blob([JSON.stringify({name,items},null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='mudhakirati-'+ymd(new Date())+'.json'; a.click(); }
function importData(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(Array.isArray(d)) items=d; else if(d&&Array.isArray(d.items)){ items=d.items; name=d.name||name; } else throw 0; save(); render(); toast('تم الاسترجاع'); }catch(e){ alert('الملف غير صالح'); } };
  r.readAsText(f); inp.value=''; }
function wipeAll(){ if(!confirm('متأكد؟ بينمسح كل شي')) return; items=[]; save(); render(); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }

document.getElementById('today').textContent=new Date().toLocaleDateString('ar-AE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
load(); applyTheme(); render(); checkAlarms();
setInterval(()=>{ checkAlarms(); if(!document.getElementById('sheet').classList.contains('open')&&!editor.classList.contains('open')) render(); },30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ render(); checkAlarms(); } });
</script>
</body>
